name: Build Ashu Music APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -storepass ashumusic123 -alias ashukey -keypass ashumusic123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Ashu Music,O=Ashu,C=IN"
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ashumusic123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ashukey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ashumusic123' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Ashu Music release ${{ github.run_number }}
          files: app/build/outputs/apk/foss/release/*.apk
